openapi: 3.0.1
info:
  title: Data API
  description: "Provides access to the Clever Data API, letting applications read\
    \ and manage education roster data such as districts, schools, courses, sections,\
    \ students and teachers, as well as assignments and submissions."
  version: 3.1.0
servers:
- url: https://api.clever.com/v3.1
security:
- bearerAuth: []
paths:
  /courses:
    get:
      tags:
      - Courses
      summary: List courses
      description: Returns a list of courses
      operationId: getCourses
      parameters:
      - name: limit
        in: query
        description: Maximum number of records to return in one page
        schema:
          type: integer
      - name: starting_after
        in: query
        description: "Cursor for forward pagination: the ID of the last record of\
          \ the previous page, so the page returned starts after it"
        schema:
          type: string
      - name: ending_before
        in: query
        description: "Cursor for backward pagination: the ID of the first record of\
          \ the next page, so the page returned ends before it"
        schema:
          type: string
      - name: count
        in: query
        description: |
          If "true", returns a CountResponse ({count, links})
          instead of the normal list response.
        schema:
          type: string
          enum:
          - ""
          - "true"
          - "false"
          - undefined
      responses:
        "200":
          description: OK Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /courses/{id}:
    get:
      tags:
      - Courses
      summary: Get a course
      description: Returns a specific course
      operationId: getCourse
      parameters:
      - name: id
        in: path
        description: ID of the course
        required: true
        schema:
          type: string
      responses:
        "200":
